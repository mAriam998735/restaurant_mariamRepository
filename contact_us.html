<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoboEat - Contact Us</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #121212; /* اسود فاتح سيكا */
        font-family: 'Poppins', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    .logo {
        color: #FFD700; /* دهبي */
        font-size: 28px;
        font-weight: 700;
        text-align: center;
        margin-bottom: 20px;
        text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    }

    .contact-container {
        background: #1A1A1A; /* المربع الكبير افتح سيكا */
        border: 2px solid #FFD700;
        border-radius: 15px;
        padding: 35px;
        width: 100%;
        max-width: 500px;
        box-shadow: 0 0 25px rgba(255, 215, 0, 0.15); /* جلو دهبي */
    }

    h1 {
        color: #FFD700; /* Contact Us دهبي */
        text-align: center;
        margin-bottom: 25px;
        font-size: 32px;
        font-weight: 700;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        color: #FFC857; /* Name, Phone لون دهبي فاتح يبان */
        font-weight: 600;
        font-size: 15px;
        margin-bottom: 8px;
        display: block;
        letter-spacing: 0.5px;
    }

    input, textarea {
        background: #1E1E1E; /* المربعات جوا افتح */
        border: 1.5px solid #FFD700;
        border-radius: 10px;
        color: #FFFFFF; /* الكتابة جوا ابيض */
        padding: 14px;
        width: 100%;
        font-size: 15px;
        transition: 0.3s;
    }

    input::placeholder, textarea::placeholder {
        color: #888;
    }

    input:focus, textarea:focus {
        border-color: #FFC857;
        box-shadow: 0 0 12px rgba(255, 200, 87, 0.4); /* جلو عند الفوكس */
        outline: none;
    }

    textarea {
        resize: vertical;
        min-height: 120px;
    }

    button.submit {
        background: linear-gradient(90deg, #FFD700, #FFC857);
        color: #121212; /* اسود على الدهبي */
        border: none;
        border-radius: 10px;
        padding: 14px 30px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        width: 100%;
        transition: 0.3s;
        letter-spacing: 1px;
    }

    button.submit:hover {
        background: #121212;
        color: #FFD700;
        border: 1.5px solid #FFD700;
        box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
    }
</style>
</head>
<body>

<div class="contact-container">
    <div class="logo">Golden Fork</div>
    <h1>Contact Us...</h1>
    
    <form>
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>

        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" placeholder="Enter your phone">
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" placeholder="Your message..."></textarea>
        </div>

        <button type="submit" class="submit">Submit</button>
    </form>
</div>

</body>
</html>
